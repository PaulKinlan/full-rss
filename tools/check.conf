# tools/check.conf — installed as ~/.fleet/check.conf on this project's VM (what `fleet new` does for a
# scaffolded project, and what `bash tools/check-cmd.sh --install` does for agents-factory).
#
# `bin/fleet-check` sources that file and runs it with the working directory set to the checkout root, so
# these commands are RELATIVE to the repo root. Neither is auto-detected: with this file installed,
# fleet-check runs exactly these and nothing else. That matters here because the auto-detected fallback for
# a Deno project is `deno task check` (one tier, no fast tier), and because ~/.fleet/check.conf is
# MACHINE-GLOBAL: on the full-rss VM an uninstalled or stale copy means fleet-check reports a verdict about
# some other repo's gate.
#
# Timeouts are KILL WINDOWS, not budgets (roles/lessons.md, "A gate bound must exceed the project real gate
# runtime"): a bound that fires reads as "unknown", not as "fail". Measured 2026-10-12 on this VM:
# full gate ~6 s, fast gate ~3 s. Both bounds are deliberately far above that for a cold Deno cache and for
# the merger preempting the heavy slot; lower them only with a fresh measurement in the commit message.
CHECK_CMD='bash tools/full-gate.sh'
CHECK_TIMEOUT=600
CHECK_FAST_CMD='bash tools/fast-gate.sh'
CHECK_FAST_TIMEOUT=180

# --- fast-gate producer verdict contract (full-rss-jr2) ----------------------------------------------------------------
# fleet-check certifies a cached fast verdict against what the gate PRINTED, not just its exit code. These
# patterns must match tools/fast-gate.sh's output contract exactly (that file's header: "Do not reformat
# those lines"). The verifier (~/fleet/remote/producer-verdict.py) takes a PASS-line pattern XOR a manifest
# receipt; this gate's terminal line is a PASS line, and the per-suite markers are the manifest's job in
# other repos — verified against real and synthetic logs before install (pass, no-work, failed,
# zero-suite, truncated, preempted-first-attempt: the last four must all refuse to certify).
#
# PASS line: 'fast-gate: PASS (N suite(s), M changed file(s))' with N >= 1 — a run that executed no suite
# never certifies through this line. 'no suites affected by ...' is the gate's documented green for
# changed-files-with-nothing-to-run, so it is declared NO-WORK and certified as no-work-exempt rather
# than left UNKNOWN; policy=pass is deliberate (policy=unknown turns every exempt-only run into UNKNOWN).
#
# OWNER scopes the declaration to THIS repository's checkouts on this VM (fleet-check unsets the contract
# for any other repo, so a machine-global install cannot certify another project's gate). Installers
# restamp it from the installing checkout's path — see ~/fleet/remote/check-conf-atomic.sh.
CHECK_FAST_PASS_RE='^fast-gate: PASS \([1-9][0-9]* suite\(s\), [0-9]+ changed file\(s\)\)$'
CHECK_FAST_NO_WORK_RE='^fast-gate: no suites affected by [0-9]+ changed file\(s\)'
CHECK_FAST_NO_WORK_POLICY=pass
CHECK_FAST_CONTRACT_OWNER="$HOME/full-rss/.git"
