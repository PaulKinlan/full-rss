# tools/gate.conf — the ONE place this repo names the commands its gates run.
#
# Read by tools/fast-gate.sh (FAST_GATE_RUNNER) and tools/full-gate.sh (FULL_TIER_CMD, STATIC_CMD). Three
# commands rather than one, for three reasons (fleet docs/speed.md):
#   FAST_GATE_RUNNER  runs ONE suite file per invocation, so the fast gate can run several suites in
#                     PARALLEL PROCESSES; a test file is the unit of parallelism.
#   FULL_TIER_CMD     every suite. Runs ONCE per landing, on the merger's merged union.
#   STATIC_CMD        type-check / lint. The cheap half of the full gate, never part of the fast one.
# Plain assignments, not `${VAR:-default}` forms: the scripts capture an explicitly exported value BEFORE
# sourcing this file, which is how tools/fast-gate.test.sh stubs the runner.
#
# --allow-env, deliberately, and it is a capability, not a gateway: importing main.ts pulls in npm CJS
# dependencies (undici, via cheerio/@mikaelporttila-rss) whose module-init code PROBES process.env —
# measured 2026-10-12: NODE_V8_COVERAGE and UNDICI_NO_FG (undici connect.js) and JEST_WORKER_ID
# (llhttp shim). A `--allow-env=VAR,VAR` whitelist therefore breaks on the next dependency bump with a
# NotCapable error that looks nothing like the change, so the gate grants the whole read. No test writes
# to the environment, the network or the filesystem.
FAST_GATE_RUNNER="deno test --allow-env"
FULL_TIER_CMD="deno test --allow-env tests"
# `deno test` type-checks every suite and what it imports; this covers the entrypoints no suite imports.
STATIC_CMD="deno check main.ts templates/index.ts"
